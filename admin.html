<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التسجيلات</title>
<style>
  :root{
    --bg:#F3F6F3; --bg2:#E4ECE4; --ink:#1F2B22; --muted:#5A6B5C;
    --accent:#3F6E54; --accent-soft:#D9E6DA; --line:#CBD9CC;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141A16; --bg2:#1E2620; --ink:#E7EEE8; --muted:#9FB3A3;
      --accent:#7FB893; --accent-soft:#273A2D; --line:#324238;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Tahoma","Segoe UI",system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    line-height:1.6;
  }
  .wrap{max-width:700px;margin:0 auto;padding:0 18px 60px;}
  header{background:var(--accent);color:#fff;margin:0 -18px 24px;padding:28px 18px 22px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;align-items:center;}
  h1{font-size:1.4rem;margin:0;font-weight:700;}
  .card{background:var(--bg2);border-inline-start:4px solid var(--accent);border-radius:10px;padding:18px;margin-bottom:16px;}
  label{display:block;font-weight:600;margin-bottom:6px;font-size:.92rem;}
  input[type=email],input[type=password]{
    width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:1rem;margin-bottom:12px;
  }
  .btn{appearance:none;border:none;border-radius:10px;padding:11px 16px;font-size:.92rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:7px 12px;border-radius:8px;font-size:.82rem;}
  .err{color:#c0392b;font-size:.88rem;margin-top:-6px;margin-bottom:10px;display:none;}
  .screen{display:none;}
  .screen.active{display:block;}
  .reg-row{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0;border-bottom:1px solid var(--line);}
  .reg-row:last-child{border-bottom:none;}
  .photos{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .photos img{width:100px;height:100px;object-fit:cover;border-radius:8px;}
  .muted{color:var(--muted);font-size:.85rem;}
  #listEmpty{text-align:center;color:var(--muted);margin-top:40px;}
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMkn1XpXLsGeO6eKNFqa64vklJwCL8XEg",
    authDomain: "hamly-pregancy.firebaseapp.com",
    projectId: "hamly-pregancy",
    storageBucket: "hamly-pregancy.firebasestorage.app",
    messagingSenderId: "411237981361",
    appId: "1:411237981361:web:9e603e72f47eede4b25690",
    measurementId: "G-D4R14DJWFC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.doLogin = async function(){
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.style.display = 'none';
    try{
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(e){
      errEl.textContent = 'تعذّر تسجيل الدخول — تأكدي من البريد وكلمة المرور.';
      errEl.style.display = 'block';
    }
  };

  window.doLogout = async function(){
    await signOut(auth);
  };

  async function loadRegistrations(){
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('listEmpty');
    listEl.innerHTML = '';
    try{
      const q = query(collection(db, 'registrations'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      if(snap.empty){ emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';
      snap.forEach(docSnap=>{
        const d = docSnap.data();
        const card = document.createElement('div');
        card.className = 'card';
        const rows = [
          ['التاريخ والوقت', (d.date||'') + ' — ' + (d.time||'')],
          ['الشهر', d.month||'—'],
          ['ولادات سابقة', d.prevBirth||'—'],
          ['عدد الولادات', d.birthCount||'—'],
          ['مضاعفات', d.complications||'لا يوجد'],
          ['انتفاخ القدمين', d.swelling||'—'],
          ['تعليق الانتفاخ', d.swellingComment||'لا يوجد'],
          ['نوع الحذاء', d.footwear||'—'],
          ['تعليق الحذاء', d.footwearComment||'لا يوجد'],
          ['تجربتها', d.experienceComment||'لا يوجد']
        ];
        card.innerHTML = rows.map(r=>`<div class="reg-row"><span class="muted">${r[0]}</span><strong>${r[1]}</strong></div>`).join('');
        const photosDiv = document.createElement('div');
        photosDiv.className = 'photos';
        [['الوجه', d.personalPhoto], ['البطن', d.bellyPhoto], ['القدمين', d.feetPhoto]].forEach(([label, src])=>{
          if(src){
            const img = document.createElement('img');
            img.src = src;
            img.title = label;
            photosDiv.appendChild(img);
          }
        });
        if(photosDiv.children.length) card.appendChild(photosDiv);
        listEl.appendChild(card);
      });
    }catch(e){
      emptyEl.textContent = 'تعذّر تحميل التسجيلات: ' + e.message;
      emptyEl.style.display = 'block';
    }
  }

  onAuthStateChanged(auth, (user)=>{
    const loginScreen = document.getElementById('loginScreen');
    const dashScreen = document.getElementById('dashScreen');
    if(user){
      loginScreen.classList.remove('active');
      dashScreen.classList.add('active');
      loadRegistrations();
    }else{
      dashScreen.classList.remove('active');
      loginScreen.classList.add('active');
    }
  });
</script>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="screen active">
    <header><h1>تسجيل الدخول</h1></header>
    <div class="card">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass">
      <div class="err" id="loginErr"></div>
      <button class="btn" style="width:100%;" onclick="doLogin()">دخول</button>
    </div>
  </div>

  <div id="dashScreen" class="screen">
    <header>
      <h1>التسجيلات</h1>
      <button class="btn-ghost" onclick="doLogout()">خروج</button>
    </header>
    <div id="list"></div>
    <div id="listEmpty">لا توجد تسجيلات بعد.</div>
  </div>

</div>
</body>
</html>
